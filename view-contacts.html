<!DOCTYPE html>
<html>

<head>
    <title>View Contacts</title>
    <link rel="stylesheet" href="styles.css">
</head>

<body>

    <!-- Sidebar -->
    <div class="sidebar">
        <h2>EMS</h2>
        <div class="profile">
            <img src="images/profile.jpg" alt="Profile" class="profile-pic">
            <p><strong>Employee</strong></p>
            <small><span class="status"></span> Online</small>
        </div>

        <nav>
            <a href="index.html">🏠 Home</a>
            <a href="new-contact.html">➕ New Contact</a>
            <a href="view-contacts.html" class="active">📋 View Contacts</a>
        </nav>

        <button class="dark-toggle" onclick="toggleDarkMode()">🌙 Dark Mode</button>
    </div>

    <!-- Main content -->
    <div class="main">
        <div class="container">

            <h2>Employee Contacts</h2>

            <!-- 🔍 SEARCH BAR -->
            <input type="text" id="search" placeholder="🔍 Search employee...">

            <table>
                <tr>
                    <th>Name</th>
                    <th>Email</th>
                    <th>Phone</th>
                    <th>Department</th>
                    <th>Actions</th>
                </tr>
                <tbody id="employeeTable"></tbody>
            </table>

        </div>
    </div>

    <script src="main.js"></script>
</body>
</html>
