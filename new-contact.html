<!DOCTYPE html>
<html>

<head>
    <title>New Contact</title>
    <link rel="stylesheet" href="styles.css">
</head>

<body>

    <!-- Sidebar -->
    <div class="sidebar">
        <h2>EMS</h2>
        <div class="profile">
            <img src="images/profile.jpg" alt="Profile" class="profile-pic">
            <p><strong>Employee</strong></p>
            <small><span class="status"></span> Online</small>
        </div>

        <a href="index.html">Home</a>
        <a href="new-contact.html" class="active">New Contact</a>
        <a href="view-contacts.html">View All Contacts</a>
    </div>

    <!-- Main content -->
    <div class="main">
        <div class="container">
            <h2>Add New Employee</h2>
            <form id="employeeForm">
                <label>Full Name</label>
                <input type="text" id="name" placeholder="Enter full name" required>

                <label>Email Address</label>
                <input type="email" id="email" placeholder="Enter email" required>

                <label>Phone Number</label>
                <input type="text" id="phone" placeholder="Enter phone number">

                <label>Department</label>
                <input type="text" id="department" placeholder="Enter department">

                <label>Position</label>
                <input type="text" id="position" placeholder="Enter position">

                <button type="submit">Submit</button>
            </form>
        </div>
    </div>

    <script src="main.js"></script>
</body>
</html>
