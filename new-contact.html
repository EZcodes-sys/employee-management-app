<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>New Contact</title>
    <link rel="stylesheet" href="styles.css">
</head>

<body>

<div class="sidebar">
    <h2>EMS</h2>

    <div class="profile">
        <img src="images/profile.jpg" class="profile-pic">
        <p><strong>Employee</strong></p>
        <small><span class="status"></span> Online</small>
    </div>

    <nav>
        <a href="index.html">🏠 Home</a>
        <a href="new-contact.html" class="active">➕ New Contact</a>
        <a href="view-contacts.html">📋 View Contacts</a>
    </nav>

    <button class="dark-toggle" onclick="toggleDarkMode()">🌙 Dark Mode</button>
</div>

<div class="main">
    <div class="container">

        <h1>Add New Employee</h1>

        <div class="quick-actions">
            <button onclick="location.href='new-contact.html'">➕ Add Employee</button>
            <button onclick="location.href='view-contacts.html'">📋 View Employees</button>
        </div>

        <form id="employeeForm">
            <label>Full Name</label>
            <input type="text" id="name" required>

            <label>Email</label>
            <input type="email" id="email" required>

            <label>Phone</label>
            <input type="text" id="phone">

            <label>Department</label>
            <input type="text" id="department">

            <label>Position</label>
            <input type="text" id="position">

            <button type="submit">Add Employee</button>
        </form>

    </div>
</div>

<script src="main.js"></script>
</body>
</html>
